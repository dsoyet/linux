# enabled=no
# show_values=yes
# invert_mouse=no
# mouse_sensitivity=0.0035
# invert_keyboard=no
# step=0.013
# fisheye_fov_step=0.1745329251

## Initial camera orientation (in radians)
# yaw=0.0
# pitch=0.0
# roll=0.0
# fov=2.1

# input_projection=0
# eye=0
# fisheye_fov=3.1415926535897932
# sampling=0

# ── 自动 VR 格式检测 ──
# 设为 no 可禁用
auto_detect=yes

# 鱼眼关键词
fisheye_keywords=fisheye,FS,fish,190,200,220,VR190,VR200,VR220
# VR180° SBS 关键词
vr180_keywords=180,SBS,VR180,3DV,HSBS,HALF_SBS,OU,HOU,HALF_OU

# 分辨率兜底：~2:1 且无关键词 → 默认按 VR180 处理
# ratio_2_1_min=1.90
# ratio_2_1_max=2.10
# unknown_2to1_action=vr180    （vr180 / prompt / none）

# ── 手动默认值（自动检测会覆盖） ──

# 180° 立体 SBS 左右眼视频用这个：
input_projection=2

# 采样算法：2=lanczos（缩小FOV时多tap采样=内置SSAA）
#sampling=2

# 另外建议把这个打开以便看到当前角度信息：
#show_values=yes

## Keybindings
toggle=Ctrl+e
look-up=Ctrl+up
look-down=Ctrl+down
look-left=Ctrl+left
look-right=Ctrl+right
roll-left=Ctrl+Shift+left
roll-right=Ctrl+Shift+right
fov-increase=Ctrl+Shift+down
fov-decrease=Ctrl+Shift+up
cycle-projection=Ctrl+Shift+p
fisheye-fov-increase=Ctrl+f
fisheye-fov-decrease=Ctrl+Shift+f
switch-eye=Ctrl+Shift+e
cycle-sampling=Ctrl+Shift+s
toggle-mouse-look=Ctrl+MBTN_LEFT
reset-view=Ctrl+r
show-help=Ctrl+t
